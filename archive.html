<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="900" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/assets/layout.css" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.png" />
  <title>Archive &middot; Ink &amp; Irony</title>
</head>

<body>
  <div class="container">
    <header>
      <div>
        <span class="status-dot"></span> Online Notebook
      </div>
      <div>
        <a href="/" class="nav-link">Feed</a>
        <a href="/rss.xml" class="nav-link">RSS</a>
      </div>
    </header>

    <main class="archive">
      <article class="header-card">
        <span class="card-pin">📌</span>
        <h1>Archive</h1>
        <p class="tagline">Select a year to explore past writings.</p>
        <div
          style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px; display: flex; justify-content: space-around; text-align: center; font-size: 0.75rem; color: var(--text-muted);">
          <div><strong style="display: block; font-size: 1rem; color: var(--cat-essay);">3</strong>Essays</div>
          <div><strong style="display: block; font-size: 1rem; color: var(--cat-fragment);">7</strong>Fragments</div>
          <div><strong style="display: block; font-size: 1rem; color: var(--cat-quote);">4</strong>Quotes</div>
          <div><strong style="display: block; font-size: 1rem; color: var(--cat-poem);">3</strong>Poems</div>
          <div><strong style="display: block; font-size: 1rem; color: var(--cat-reflection);">2</strong>Reflections
          </div>
        </div>
      </article>

      <a class="archive-card" href="/2026/">
        <span>2026</span>
        <span class="card-text-md" style="margin: 0; color: var(--text-muted);">19 Posts</span>
      </a>

    </main>

    <footer>
      <p class="copyright">
        &copy; <span id="year"></span> Ink & Irony - All Rights Reserved.
      </p>
    </footer>
  </div>
  <script src="/assets/year.js"></script>
</body>

</html>
